name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes (regras, parser da IA, Regex e cenários da demonstração)
        working-directory: backend
        run: mvn -B -q verify
